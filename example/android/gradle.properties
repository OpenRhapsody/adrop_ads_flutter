# Raised 1536M -> 2048M to match the react-native example: org.gradle.parallel below runs workers
# concurrently in this daemon, and 1536M leaves little headroom (GC thrash / OOM risk).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.enableJetifier=true

org.gradle.parallel=true

# Build cache — stores task outputs under ~/.gradle/caches/build-cache-1, so they are reused
# across *different checkouts*, not just across builds in this one.
# Why it is on: our AI agent (bottari) creates a fresh git worktree per story to verify changes.
# Every worktree starts with an empty android/build and android/.gradle, so each one paid a full
# cold build (measured 2026-07-15 on the react-native example: 10m04s — which tripped the agent's
# 10-minute readiness timeout by 4 seconds and reported BLOCKED even though the APK had just been
# produced). The build cache lives outside the checkout, so a fresh worktree reuses the previous
# build's task outputs. Human developers get the same win: rebuilds after a branch switch stop
# starting from zero.
org.gradle.caching=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
